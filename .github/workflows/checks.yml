name: Checks
on:
  pull_request:
  push:
    branches: [main, 'feat/**']
permissions:
  contents: read
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  local-contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .node-version
          cache: npm
      - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with:
          version: '0.12.19'
          enable-cache: true
      - name: Install locked dependencies
        run: |
          uv sync --frozen --all-extras
          npm ci
          npx playwright install --with-deps chromium
      - name: Start local synthetic dependencies
        run: |
          docker compose up -d --wait postgres oidc
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:28080/realms/adaptive-planner/.well-known/openid-configuration >/dev/null; then break; fi
            sleep 2
          done
          curl --fail --silent http://127.0.0.1:28080/realms/adaptive-planner/.well-known/openid-configuration >/dev/null
          uv run alembic upgrade head
      - name: Python behavior and relational contracts
        run: |
          uv run ruff check services tests db benchmarks
          uv run pytest -q
      - name: Typed browser application
        run: |
          npm run api:check
          npm run typecheck
          npm test
          npm run build
      - name: Real local browser journey
        run: |
          mkdir -p .runtime
          uv run python -m planner.jobs.worker >.runtime/worker.log 2>&1 &
          worker_pid=$!
          uv run python -m planner.ai.worker >.runtime/interpretation-worker.log 2>&1 &
          ai_pid=$!
          uv run python -m planner.calendar.worker >.runtime/calendar-worker.log 2>&1 &
          calendar_pid=$!
          trap 'kill "$worker_pid" "$ai_pid" "$calendar_pid" 2>/dev/null || true' EXIT
          npm run test:e2e
      - name: Preserve failure evidence
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: local-failure-evidence
          path: |
            test-results/
            .runtime/*worker.log
          include-hidden-files: true
          retention-days: 7
      - name: Stop disposable dependencies
        if: always()
        run: docker compose down

  image-and-infrastructure:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: '1.16.2'
      - name: Offline infrastructure validation
        run: |
          terraform -chdir=infra/terraform init -backend=false -input=false -lockfile=readonly
          terraform -chdir=infra/terraform fmt -check -recursive
          terraform -chdir=infra/terraform validate
          terraform -chdir=infra/terraform test
      - name: Build immutable candidate image
        run: docker build --target runtime --build-arg REVISION="${GITHUB_SHA}" -t "planner:${GITHUB_SHA}" .
      - name: Scan fixable high and critical image vulnerabilities
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:0.69.3@sha256:bcc376de8d77cfe086a917230e818dc9f8528e3c852f7b1aff648949b6258d1c \
            image --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 "planner:${GITHUB_SHA}"
      - name: Image liveness and non-root smoke
        run: |
          cid=$(docker run -d --read-only --tmpfs /tmp:rw,nosuid,size=128m -p 127.0.0.1:28001:8000 "planner:${GITHUB_SHA}")
          trap 'docker rm -f "$cid" >/dev/null' EXIT
          test "$(docker inspect "$cid" --format '{{.Config.User}}')" = "10001:10001"
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:28001/health/live >/dev/null; then break; fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:28001/ | grep -q '<html'
