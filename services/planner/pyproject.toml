[project]
name = "planner"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi==0.135.1",
  "pydantic==2.13.5",
  "pydantic-settings==2.15.0",
  "sqlalchemy==2.0.48",
  "alembic==1.20.0",
  "psycopg[binary]==3.3.6",
  "uvicorn==0.54.0",
  "ortools==9.15.6755",
  "scikit-learn==1.9.1",
  "authlib==1.8.0",
  "httpx==0.28.1",
  "tzdata==2026.4",
  "starlette==1.3.1",
  "anyio==4.14.2",
  "httpx2==2.13.1",
  "joserfc==1.7.5",
  "cryptography==50.0.1",
  "opentelemetry-api==1.44.0",
  "opentelemetry-sdk==1.44.0",
  "opentelemetry-exporter-otlp-proto-http==1.44.0",
]

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/planner"]
